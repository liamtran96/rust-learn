# Short, repository-root commands for each standalone exercise crate.
# `$new-exercise <chapter> <slug>` keeps this file updated.

[jobs.count-digits]
command = ["cargo", "check"]
workdir = "code/01-fundamentals/count-digits"
watch = ["code/01-fundamentals/count-digits/src", "code/01-fundamentals/count-digits/Cargo.toml"]
default_watch = false

[jobs.count-digits-run]
command = ["cargo", "run"]
workdir = "code/01-fundamentals/count-digits"
watch = ["code/01-fundamentals/count-digits/src", "code/01-fundamentals/count-digits/Cargo.toml"]
default_watch = false
need_stdout = true

