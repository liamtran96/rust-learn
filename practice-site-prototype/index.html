<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Practice Rust from your own learning progress and mistakes." />
    <title>Rust Recall Lab — Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div class="loading">Loading your learning record…</div>

      <button id="next-variant" aria-label="Next layout">→</button>
    </nav>
    <script src="app.js"></script>
  </body>
</html>
